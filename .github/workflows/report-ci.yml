name: Report Engine CI

on:
  push:
    branches: [ feature/report-refactor, dev, main ]
  pull_request:
    branches: [ feature/report-refactor, dev, main ]

jobs:
  test-report-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TeX Live and system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            ghostscript \
            libgl1 \
            libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylatex matplotlib pdfplumber pytest pytest-cov openseespy opsvis scipy shapely pydantic xarray
          pip install -e . --no-deps
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> $GITHUB_ENV

      - name: Run automated test suite
        run: |
          pytest -q tests/unit/

      - name: Build Report_After.pdf from fixture
        run: |
          mkdir -p artifacts
          python -m osdagbridge.core.reports.cli \
            --fixture tests/fixtures/reports/baseline_default.json \
            --out artifacts \
            --stem Report_After

      - name: Verify generated PDF
        run: |
          test -f artifacts/Report_After.pdf
          echo "Report_After.pdf generated successfully with size $(stat -c%s artifacts/Report_After.pdf) bytes."

      - name: Upload Report_After.pdf artifact
        uses: actions/upload-artifact@v4
        with:
          name: Report_After
          path: artifacts/Report_After.pdf
